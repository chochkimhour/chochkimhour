name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in README.md assets/dark_mode.svg assets/light_mode.svg assets/choch_kimhour.txt; do
            if [ ! -f "$f" ]; then
              echo "Error: $f is missing"
              exit 1
            fi
          done
          echo "Required files present."

      - name: Check README uses Andrew-style SVG card
        run: |
          if ! grep -q 'assets/dark_mode.svg' README.md; then
            echo "Error: README.md must reference assets/dark_mode.svg"
            exit 1
          fi
          if ! grep -q 'assets/light_mode.svg' README.md; then
            echo "Error: README.md must reference assets/light_mode.svg"
            exit 1
          fi
          echo "SVG card references OK."

      - name: Check clickable contact links
        run: |
          for url in \
            "https://www.linkedin.com/in/choch-kimhour" \
            "https://chochkimhour.github.io/my-portfolio" \
            "https://www.npmjs.com/~chochkimhour"
          do
            if ! grep -q "$url" README.md; then
              echo "Error: README.md missing clickable URL: $url"
              exit 1
            fi
          done
          echo "Clickable links present."

      - name: Check for broken Markdown links
        run: |
          if grep -n '\[.*\](\s*)' README.md; then
            echo "Error: Found empty Markdown links"
            exit 1
          fi
          echo "Link validation passed."
