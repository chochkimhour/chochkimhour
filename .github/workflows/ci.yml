name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README exists
        run: |
          if [ ! -f README.md ]; then
            echo "Error: README.md is missing"
            exit 1
          fi
          echo "README.md present."

      - name: Check no profile images in README
        run: |
          if grep -qiE '<img|dark_mode\.(png|svg)|light_mode\.(png|svg)|avatar\.png' README.md; then
            echo "Error: README.md must not include profile images"
            exit 1
          fi
          echo "No profile images in README."

      - name: Check clickable contact links
        run: |
          for url in \
            "https://www.linkedin.com/in/choch-kimhour" \
            "https://chochkimhour.github.io/my-portfolio" \
            "https://www.npmjs.com/~chochkimhour"
          do
            if ! grep -q "$url" README.md; then
              echo "Error: README.md missing clickable URL: $url"
              exit 1
            fi
          done
          echo "Clickable links present."

      - name: Check for broken Markdown links
        run: |
          if grep -n '\[.*\](\s*)' README.md; then
            echo "Error: Found empty Markdown links"
            exit 1
          fi
          if grep -n '\[.*\](www\.' README.md; then
            echo "Warning: Found links without http/https protocol"
          fi
          echo "Link validation passed."
