name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in README.md assets/dark_mode.png assets/light_mode.png assets/choch_kimhour.txt; do
            if [ ! -f "$f" ]; then
              echo "Error: $f is missing"
              exit 1
            fi
          done
          echo "Required files present."

      - name: Check README uses PNG cards (GitHub-stable)
        run: |
          if ! grep -q 'assets/dark_mode.png' README.md; then
            echo "Error: README.md must reference assets/dark_mode.png"
            exit 1
          fi
          if ! grep -q 'assets/light_mode.png' README.md; then
            echo "Error: README.md must reference assets/light_mode.png"
            exit 1
          fi
          if grep -qiE 'dark_mode\.svg|light_mode\.svg|###[[:space:]]*Links' README.md; then
            echo "Error: README must not use SVG cards or Links section"
            exit 1
          fi
          echo "README checks passed."
