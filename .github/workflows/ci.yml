name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README and card assets exist
        run: |
          for f in README.md assets/dark_mode.png assets/light_mode.png assets/avatar.png; do
            if [ ! -f "$f" ]; then
              echo "Error: $f is missing"
              exit 1
            fi
          done
          echo "Required files present."

      - name: Check README is image-only profile card
        run: |
          if ! grep -q 'assets/dark_mode.png' README.md; then
            echo "Error: README.md must reference assets/dark_mode.png"
            exit 1
          fi
          if ! grep -q 'assets/light_mode.png' README.md; then
            echo "Error: README.md must reference assets/light_mode.png"
            exit 1
          fi
          if grep -qE '##[[:space:]]+(Tech Stack|Projects|Experience|Connect)' README.md; then
            echo "Error: README.md should not include those markdown sections."
            exit 1
          fi
          echo "README.md profile card checks passed."

      - name: Check for broken Markdown links
        run: |
          if grep -n '\[.*\](\s*)' README.md; then
            echo "Error: Found empty Markdown links"
            exit 1
          fi
          if grep -n '\[.*\](www\.' README.md; then
            echo "Warning: Found links without http/https protocol"
          fi
          echo "Link validation passed."
